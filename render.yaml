services:
  - type: web
    name: url-shortener-server
    runtime: node
    plan: free
    rootDir: server_node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INSTANCE_NAME
        value: Render-Server
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: MONGOURL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
